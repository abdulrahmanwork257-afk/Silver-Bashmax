<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Suly / Buzan Ledger</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07101c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK — plain <script> tags, no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Export libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --bg1:#EEF2F7; --bg2:#FBFAF8;
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.82);
    --border:rgba(255,255,255,.65); --border-soft:rgba(0,0,0,.07);
    --ink:#1C1C1E; --muted:#6E6E73; --muted-2:#8E8E93;
    --gold:#B8860B; --gold-soft:#D8A93A; --gold-ghost:rgba(184,134,11,.12);
    --green-bg:rgba(52,199,89,.16); --green-fg:#1C7C33;
    --red-bg:rgba(255,59,48,.14); --red-fg:#C62828;
    --radius:20px; --radius-sm:14px; --radius-xs:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(216,169,58,.10), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(90,140,220,.08), transparent 40%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#ffffff);
    background-attachment:fixed;
  }
  body[dir='rtl']{font-family:'Noto Sans Arabic',-apple-system,sans-serif;}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  .glass{
    background:var(--glass); backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(31,38,135,.08), inset 0 1px 0 rgba(255,255,255,.5);
  }

  .login-logo{display:block;width:104px;height:104px;margin:0 auto 18px;border-radius:50%;box-shadow:0 8px 22px rgba(0,0,0,.22);}
  .side-logo{display:block;width:52px;height:52px;border-radius:50%;margin:0 0 12px;box-shadow:0 4px 12px rgba(0,0,0,.18);}
  /* ---- Login ---- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;padding:36px;}
  .login-card h1{font-size:26px;color:var(--ink);margin-bottom:4px;text-align:center;}
  .login-card p{color:var(--muted);margin:0 0 26px;font-size:14px;text-align:center;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input,select,textarea{
    width:100%;background:rgba(255,255,255,.7);border:1px solid var(--border-soft);color:var(--ink);
    padding:12px 14px;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;margin-bottom:16px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft);background:#fff;}
  input:hover,select:hover{border-color:var(--gold-soft);}
  button{
    background:var(--gold);color:#fff;border:none;padding:12px 20px;border-radius:999px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s,background .15s;
  }
  button:hover{background:#A4780A;}
  button:active{transform:scale(.97);}
  button.secondary{background:var(--glass-strong);color:var(--ink);border:1px solid var(--border-soft);}
  button.secondary:hover{background:#fff;}
  button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-ghost);padding:8px 14px;font-size:13px;}
  button.danger{background:transparent;color:var(--red-fg);border:1px solid rgba(255,59,48,.3);padding:7px 12px;font-size:12px;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;}
  .error{color:var(--red-fg);font-size:13px;margin:-8px 0 16px;}
  .hint{color:var(--muted-2);font-size:12px;margin-top:-8px;margin-bottom:16px;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{width:230px;flex-shrink:0;margin:16px 0 16px 16px;padding:22px 16px;height:calc(100vh - 32px);position:sticky;top:16px;display:flex;flex-direction:column;}
  body[dir='rtl'] .sidebar{margin:16px 16px 16px 0;}
  .sidebar .brand{font-size:17px;color:var(--ink);margin-bottom:2px;}
  .sidebar .who{font-size:12px;color:var(--muted);margin-bottom:20px;}
  .lang-switch{display:flex;gap:6px;margin-bottom:18px;}
  .lang-switch button{flex:1;padding:7px 8px;font-size:12px;background:rgba(255,255,255,.5);color:var(--muted);border:1px solid var(--border-soft);}
  .lang-switch button.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  #tab-list{flex:1;overflow-y:auto;}
  #tab-select{display:none;}
  .tab-btn{display:block;width:100%;text-align:inherit;background:none;border:none;color:var(--ink);
    padding:10px 12px;border-radius:var(--radius-xs);font-size:14px;margin-bottom:3px;cursor:pointer;}
  .tab-btn:hover{background:rgba(255,255,255,.6);}
  .tab-btn.active{background:var(--gold);color:#fff;font-weight:600;}
  .sidebar .signout{margin-top:16px;font-size:13px;color:var(--muted);cursor:pointer;text-align:center;padding:8px;border-radius:var(--radius-xs);}
  .sidebar .signout:hover{background:rgba(255,255,255,.6);}

  .main{flex:1;padding:32px 36px;max-width:1120px;}
  .main h2{font-size:23px;}
  .subhead{color:var(--muted);font-size:13px;margin:4px 0 22px;}

  .range-row{display:flex;gap:8px;align-items:end;margin-bottom:20px;flex-wrap:wrap;}
  .range-row button.chip{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--border-soft);
    padding:8px 14px;font-size:13px;font-weight:500;border-radius:999px;}
  .range-row button.chip.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .range-row input[type=date]{margin-bottom:0;width:auto;}

  .way-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .way-card{padding:20px;}
  .way-card h3{font-size:14px;color:var(--ink);margin-bottom:14px;}
  .way-card .rows{display:flex;flex-direction:column;gap:10px;}
  .way-card .leg{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:rgba(255,255,255,.5);border-radius:var(--radius-xs);}
  .way-card .leg .label{font-size:12px;color:var(--muted);}
  .way-card .leg .val{font-size:16px;font-weight:700;}
  .way-card .leg .amt{font-size:12px;color:var(--muted-2);display:block;text-align:end;}

  .panel{padding:24px;margin-bottom:20px;}
  .panel h3{font-size:15px;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px;}
  .form-grid .full{grid-column:1/-1;}
  .computed-row{display:flex;gap:22px;padding:14px 0;margin:4px 0 18px;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .computed-row div{font-size:12px;color:var(--muted);}
  .computed-row span{display:block;color:var(--ink);font-size:15px;margin-top:2px;font-weight:600;}
  .computed-row small.kgnote{display:block;font-size:11px;color:var(--muted);opacity:.8;margin-top:1px;}
  .margin-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;}
  .margin-pos{background:var(--green-bg);color:var(--green-fg);}
  .margin-neg{background:var(--red-bg);color:var(--red-fg);}

  .export-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:inherit;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tr:hover td{background:rgba(255,255,255,.5);}
  .row-actions button{margin-inline-end:6px;}
  .empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center;}
  #table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:760px;}

  @media (max-width: 880px){
    #app.active{flex-direction:column;}
    .sidebar{
      width:auto;margin:12px;height:auto;position:static;padding:14px 16px;
      display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;
    }
    .sidebar .brand{white-space:nowrap;font-size:15px;margin:0;}
    .side-logo{width:36px;height:36px;margin:0;flex-shrink:0;}
    .sidebar .who{display:none;}
    .lang-switch{margin:0;flex-shrink:0;width:auto;}
    #tab-list{display:none;}
    #add-employee-link{order:1;flex-shrink:0;}
    #add-employee-link button{width:auto;margin:0;}
    .sidebar .signout{margin:0;white-space:nowrap;flex-shrink:0;order:2;}
    #tab-select{
      display:block;order:3;flex-basis:100%;width:100%;margin:0;
      padding:11px 14px;font-size:14px;font-weight:600;background:var(--gold);color:#fff;
      border:none;border-radius:999px;-webkit-appearance:none;appearance:none;
    }
    .main{padding:16px;}
    .way-grid{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:repeat(2,1fr);}
    .panel{padding:16px;}
    table{font-size:12px;min-width:640px;}
  }
  @media (max-width: 520px){
    .form-grid{grid-template-columns:1fr;}
    .login-card{padding:24px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card glass">
    <img class="login-logo" src="logo.png" alt="" onerror="this.style.display='none'">
    <h1 data-i18n="brand">Suly / Buzan Ledger</h1>
    <p data-i18n="loginSub">Sign in to record and review transactions.</p>
    <div id="login-error" class="error" style="display:none;"></div>
    <div id="login-form">
      <label for="lu" data-i18n="username">Username</label>
      <input id="lu" type="text" autocomplete="username">
      <label for="lp" data-i18n="password">Password</label>
      <input id="lp" type="password" autocomplete="current-password">
      <button onclick="doLogin()" style="width:100%;" data-i18n="signIn">Sign in</button>
      <div style="text-align:center;margin-top:16px;">
        <button class="link-btn" id="show-setup-link" style="display:none;" onclick="toggleSetup(true)" data-i18n="firstTimeLink">First time? Create the admin account</button>
      </div>
    </div>
    <div id="setup-form" style="display:none;">
      <label for="su" data-i18n="username">Username</label>
      <input id="su" type="text" autocomplete="off">
      <label for="sn" data-i18n="fullName">Full name</label>
      <input id="sn" type="text" autocomplete="off">
      <label for="sp" data-i18n="password">Password</label>
      <input id="sp" type="password" autocomplete="new-password">
      <div class="hint" data-i18n="setupHint">This creates the one and only admin account — do this once.</div>
      <button onclick="createFirstAdmin()" style="width:100%;" data-i18n="createAdmin">Create admin account</button>
      <div style="text-align:center;margin-top:16px;">
        <button class="link-btn" onclick="toggleSetup(false)" data-i18n="backToLogin">Back to sign in</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="sidebar glass">
    <img class="side-logo" src="logo.png" alt="" onerror="this.style.display='none'">
    <div class="brand" data-i18n="brand">Suly / Buzan</div>
    <div class="who" id="who"></div>
    <div class="lang-switch"><button id="lang-en" onclick="setLang('en')">English</button><button id="lang-ckb" onclick="setLang('ckb')">کوردی</button></div>
    <div id="tab-list"></div>
    <select id="tab-select" onchange="switchTab(this.value)"></select>
    <div id="add-employee-link" style="display:none;"><button class="ghost" style="width:100%;margin-bottom:10px;" onclick="openAddEmployee()" data-i18n="addEmployee">+ Add employee</button></div>
    <div class="signout" onclick="signOut()" data-i18n="signOut">Sign out</div>
  </div>

  <div class="main">
    <h2 id="viewing-title">Log</h2>
    <div class="subhead" id="viewing-sub"></div>

    <div class="range-row">
      <button class="chip" data-range="today" onclick="setRange('today')" data-i18n="today">Today</button>
      <button class="chip" data-range="week" onclick="setRange('week')" data-i18n="thisWeek">This week</button>
      <button class="chip" data-range="month" onclick="setRange('month')" data-i18n="thisMonth">This month</button>
      <button class="chip" data-range="all" onclick="setRange('all')" data-i18n="allTime">All time</button>
      <div><label style="margin-bottom:4px;" data-i18n="from">From</label><input type="date" id="range-from" onchange="setRange('custom')"></div>
      <div><label style="margin-bottom:4px;" data-i18n="to">To</label><input type="date" id="range-to" onchange="setRange('custom')"></div>
    </div>

    <div class="way-grid" id="way-grid"></div>
    <div class="panel glass" id="balance-panel"></div>

    <div class="panel glass" id="entry-panel" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h3 id="form-title" data-i18n="addTransaction" style="margin:0;">Add transaction</h3>
        <button class="ghost" onclick="openAddKg()" data-i18n="addKgAllowance">+ Add KG allowance</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div><label data-i18n="date">Date</label><input type="date" id="f-date"></div>
        <div><label data-i18n="type">Type</label>
          <select id="f-type">
            <option value="Sell Suly / Buy Buzan" data-i18n="way1">Sell Suly / Buy Buzan</option>
            <option value="Buy Suly / Sell Buzan" data-i18n="way2">Buy Suly / Sell Buzan</option>
          </select>
        </div>
        <div><label data-i18n="kg">KG</label><input type="number" step="any" id="f-kg" oninput="updateComputed()"></div>
        <div><label data-i18n="customer">Customer / phone</label><input type="text" id="f-customer"></div>
        <div><label data-i18n="rate">Rate (per troy oz)</label><input type="number" step="any" id="f-rate" oninput="updateComputed()"></div>
        <div><label data-i18n="price">Negotiated price (per KG)</label><input type="number" step="any" id="f-price" oninput="updateComputed()"></div>
        <div class="full"><label data-i18n="notes">Notes</label><input type="text" id="f-notes"></div>
      </div>
      <div class="computed-row">
        <div data-i18n="ounce">Ounce<span class="num" id="c-ounce">0.00</span></div>
        <div data-i18n="marketPrice">Market price / KG<span class="num" id="c-market">$0.00</span></div>
        <div data-i18n="margin">Margin<span class="num" id="c-margin"><span class="margin-pill">$0.00</span></span></div>
        <div data-i18n="total">Total<span class="num" id="c-total">$0.00</span></div>
        <div data-i18n="plKg">P/L × KG<span class="num" id="c-plkg">$0.00</span></div>
      </div>
      <button onclick="submitRecord()" data-i18n="saveTransaction">Save transaction</button>
      <button class="secondary" id="cancel-edit" style="display:none;margin-inline-start:8px;" onclick="resetForm()" data-i18n="cancelEdit">Cancel edit</button>
    </div>

    <div class="panel glass">
      <h3 data-i18n="transactions">Transactions</h3>
      <div class="export-row" id="export-row" style="display:none;">
        <button class="secondary" onclick="exportXlsx()" data-i18n="downloadXlsx">⬇ Download XLSX</button>
        <button class="secondary" onclick="exportPdf()" data-i18n="downloadPdf">⬇ Download PDF</button>
      </div>
      <div id="table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<!-- ============ ADD KG ALLOWANCE MODAL ============ -->
<div id="add-kg-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:center;justify-content:center;padding:20px;">
  <div class="glass" style="max-width:380px;width:100%;padding:28px;">
    <h3 style="margin-bottom:16px;" id="kg-modal-title" data-i18n="addKgAllowance">+ Add KG allowance</h3>
    <input type="hidden" id="kg-edit-id">
    <label data-i18n="date">Date</label><input id="kg-date" type="date">
    <label data-i18n="grantType">Silver type</label>
    <select id="kg-type">
      <option value="Suly Allowance" data-i18n="grantSuly">Suly</option>
      <option value="Buzan Allowance" data-i18n="grantBuzan">Buzan</option>
    </select>
    <label data-i18n="kg">KG</label><input id="kg-amount" type="number" step="any">
    <label data-i18n="notes">Notes</label><input id="kg-notes" type="text">
    <div id="kg-error" class="error" style="display:none;"></div>
    <button onclick="submitKgGrant()" data-i18n="save">Save</button>
    <button class="secondary" style="margin-inline-start:8px;" onclick="closeAddKg()" data-i18n="cancel">Cancel</button>
  </div>
</div>

<!-- ============ ADD EMPLOYEE MODAL ============ -->
<div id="add-employee-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:center;justify-content:center;padding:20px;">
  <div class="glass" style="max-width:380px;width:100%;padding:28px;">
    <h3 style="margin-bottom:16px;" data-i18n="addEmployee">+ Add employee</h3>
    <label data-i18n="username">Username</label><input id="ne-username" type="text">
    <label data-i18n="fullName">Full name</label><input id="ne-fullname" type="text">
    <label data-i18n="password">Password</label><input id="ne-password" type="text">
    <label data-i18n="roleLabel">Role</label>
    <select id="ne-role">
      <option value="employee" data-i18n="roleEmployee">Employee (own tab, view only)</option>
      <option value="hr" data-i18n="roleHr">HR (view &amp; download everything, no editing)</option>
    </select>
    <div id="ne-error" class="error" style="display:none;"></div>
    <button onclick="submitNewEmployee()" data-i18n="save">Save</button>
    <button class="secondary" style="margin-inline-start:8px;" onclick="closeAddEmployee()" data-i18n="cancel">Cancel</button>
  </div>
</div>

<script>
/* ====================================================================
   FIREBASE CONFIG — paste your project's config object here.
   Firebase Console → Project settings → General → Your apps → SDK setup.
   ==================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC5yab_KHtWM6awr7kuapSlz7SIeBjERlE",
  authDomain: "suly-buzan-ledger.firebaseapp.com",
  projectId: "suly-buzan-ledger",
  storageBucket: "suly-buzan-ledger.firebasestorage.app",
  messagingSenderId: "477670457012",
  appId: "1:477670457012:web:3561167783fc27d4eee1e1"
};
const AUTH_EMAIL_DOMAIN = 'ledger.local'; // usernames become username@ledger.local internally — not a real mailbox

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function toEmail(username){ return String(username).trim().toLowerCase().replace(/\s+/g,'') + '@' + AUTH_EMAIL_DOMAIN; }

function canBrowseAll(){ return !!session && (session.role === 'admin' || session.role === 'hr'); }
function subText(){
  if(!session) return '';
  if(viewingTab === 'ALL') return session.role === 'hr' ? t('hrSub') : t('combinedSub');
  return session.role === 'admin' ? t('editableSub') : (session.role === 'hr' ? t('hrSub') : t('viewOnlySub'));
}
function fmtMoney(n){ return '$' + round2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function fmtSigned(n){ const v = round2(n); return (v >= 0 ? '+' : '-') + '$' + Math.abs(v).toFixed(2); }

const OUNCE_DIVISOR = 155.52;
const TROY_OUNCE_GRAMS = 31.103479;
const WAY1 = 'Sell Suly / Buy Buzan';
const WAY2 = 'Buy Suly / Sell Buzan';
const GRANT_SULY = 'Suly Allowance';
const GRANT_BUZAN = 'Buzan Allowance';

/* ====== I18N ====== */
const I18N = {
  en: {
    brand: 'Suly / Buzan Ledger', loginSub: 'Sign in to record and review transactions.',
    username: 'Username', password: 'Password', signIn: 'Sign in', signOut: 'Sign out',

let LANG = localStorage.getItem('sbl_lang') || 'en';
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }

function applyStaticTranslations(){
  document.body.setAttribute('dir', LANG === 'ckb' ? 'rtl' : 'ltr');
  document.getElementById('lang-en').classList.toggle('active', LANG === 'en');
  document.getElementById('lang-ckb').classList.toggle('active', LANG === 'ckb');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const nested = el.querySelector('span');
    el.textContent = t(key);
    if(nested) el.appendChild(nested);
  });
}
function setLang(lang){
  LANG = lang; localStorage.setItem('sbl_lang', lang);
  applyStaticTranslations();
  if(session){
    document.getElementById('viewing-sub').textContent = subText();
    if(viewingTab === 'ALL') document.getElementById('viewing-title').textContent = t('combinedTitle');
    buildSidebar();
    renderAll();
  }
}

/* ====== AUTH ====== */
async function doLogin(){
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!username || !password){ errEl.textContent = t('enterCreds'); errEl.style.display='block'; return; }
  try{
    const cred = await auth.signInWithEmailAndPassword(toEmail(username), password);
    const doc = await db.collection('employees').doc(cred.user.uid).get();
    if(!doc.exists){ errEl.textContent = t('invalidLogin'); errEl.style.display='block'; await auth.signOut(); return; }
    const d = doc.data();
    session = { uid: cred.user.uid, fullName: d.fullName, role: d.role, tabName: d.tabName };
    enterApp();
  }catch(e){
    errEl.textContent = t('invalidLogin'); errEl.style.display = 'block';
  }
}

function signOut(){
  if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  auth.signOut();
  session = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
}

function toggleSetup(show){
  document.getElementById('login-form').style.display = show ? 'none' : 'block';
  document.getElementById('setup-form').style.display = show ? 'block' : 'none';
}

async function checkFirstRunSetup(){
  try{
    const setupDoc = await db.collection('meta').doc('setup').get();
    document.getElementById('show-setup-link').style.display = setupDoc.exists ? 'none' : 'inline';
  }catch(e){ /* ignore — if rules aren't deployed yet this just stays hidden */ }
}

async function createFirstAdmin(){
  const username = document.getElementById('su').value.trim();
  const fullName = document.getElementById('sn').value.trim();
  const password = document.getElementById('sp').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!username || !fullName || !password){ errEl.textContent = t('fillAllFields'); errEl.style.display='block'; return; }
  try{
    const setupDoc = await db.collection('meta').doc('setup').get();
    if(setupDoc.exists){ errEl.textContent = t('setupAlreadyDone'); errEl.style.display='block'; return; }
    const cred = await auth.createUserWithEmailAndPassword(toEmail(username), password);
    await db.collection('employees').doc(cred.user.uid).set({ username, fullName, role: 'admin', tabName: 'Admin' });
    await db.collection('meta').doc('setup').set({ adminCreated: true });
    session = { uid: cred.user.uid, fullName, role: 'admin', tabName: 'Admin' };
    enterApp();
  }catch(e){
    errEl.textContent = String(e.message || e); errEl.style.display = 'block';
  }
}

/* ---- Secondary app instance so adding an employee doesn't sign the admin out ---- */
async function submitNewEmployee(){
  const username = document.getElementById('ne-username').value.trim();
  const fullName = document.getElementById('ne-fullname').value.trim();
  const password = document.getElementById('ne-password').value;
  const errEl = document.getElementById('ne-error');
  errEl.style.display = 'none';
  if(!username || !fullName || !password){ errEl.textContent = t('fillAllFields'); errEl.style.display='block'; return; }

  const secondary = firebase.initializeApp(firebaseConfig, 'secondary-' + Date.now());
  try{
    const cred = await secondary.auth().createUserWithEmailAndPassword(toEmail(username), password);
    const role = document.getElementById('ne-role').value;
    await db.collection('employees').doc(cred.user.uid).set({ username, fullName, role, tabName: role === 'hr' ? 'HR' : fullName });
    await secondary.auth().signOut();
    await secondary.delete();
    closeAddEmployee();
    employees = [];
    await buildSidebar();
  }catch(e){
    errEl.textContent = String(e.message || e); errEl.style.display = 'block';
    try{ await secondary.delete(); }catch(_){}
  }
}

async function buildSidebar(){
  const list = document.getElementById('tab-list');
  const select = document.getElementById('tab-select');
  list.innerHTML = '';
  select.innerHTML = '';
  if(canBrowseAll()){
    if(!employees.length){
      const snap = await db.collection('employees').get();
      employees = snap.docs.map(d => d.data());
    }
    const allBtn = document.createElement('button');
    allBtn.className = 'tab-btn' + (viewingTab==='ALL' ? ' active' : '');
    allBtn.textContent = t('allEmployees');
    allBtn.onclick = (ev) => switchTab('ALL', ev.target);
    list.appendChild(allBtn);
    addSelectOption(select, 'ALL', t('allEmployees'));
    employees.filter(emp => emp.role !== 'hr').forEach(emp => {
      const b = document.createElement('button');
      b.className = 'tab-btn' + (viewingTab===emp.tabName ? ' active' : '');
      b.textContent = emp.fullName;
      b.onclick = (ev) => switchTab(emp.tabName, ev.target);
      list.appendChild(b);
      addSelectOption(select, emp.tabName, emp.fullName);
    });
    select.value = viewingTab;
  } else {
    const b = document.createElement('button');
    b.className = 'tab-btn active';
    b.textContent = session.fullName;
    list.appendChild(b);
    addSelectOption(select, session.tabName, session.fullName);
    select.value = session.tabName;
    select.disabled = true;
  }
}

function addSelectOption(select, value, label){
  const opt = document.createElement('option');
  opt.value = value; opt.textContent = label;
  select.appendChild(opt);
}

function switchTab(tabName, btnEl){
  viewingTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btnEl) btnEl.classList.add('active');
  const select = document.getElementById('tab-select');
  if(select.value !== tabName) select.value = tabName;
  const canEdit = (tabName !== 'ALL') && session.role === 'admin';
  document.getElementById('entry-panel').style.display = canEdit ? 'block' : 'none';
  document.getElementById('viewing-title').textContent = tabName === 'ALL' ? t('combinedTitle') : tabName;
  document.getElementById('viewing-sub').textContent = subText();
  loadData();
}

/* ====== DATE RANGE ====== */
let currentRange = 'today';
function setRange(mode){
  currentRange = mode;
  document.querySelectorAll('.range-row .chip').forEach(b=>b.classList.remove('active'));
  const now = new Date();
  let from = null, to = null;
  if(mode === 'today'){ from = to = ymd(now); }
  else if(mode === 'week'){
    const day = now.getDay();
    const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7));
    from = ymd(monday); to = ymd(now);
  } else if(mode === 'month'){
    from = ymd(new Date(now.getFullYear(), now.getMonth(), 1)); to = ymd(now);
  } else if(mode === 'all'){ from = ''; to = ''; }
  if(mode !== 'custom'){
    document.getElementById('range-from').value = from || '';
    document.getElementById('range-to').value = to || '';
    const btn = document.querySelector('.chip[data-range="'+mode+'"]');
    if(btn) btn.classList.add('active');
  }
  loadData();
}
function ymd(d){ return d.toISOString().slice(0,10); }

/* ====== LIVE DATA ======
   One Firestore listener per tab (no date filter in the query at all — this avoids
   ever needing a composite index, and means switching Today/Week/Month/Custom is
   instant, filtered in the browser from data already in memory). */
let allRecords = [];
let subscribedTab = null;

function loadData(){
  if(subscribedTab === viewingTab){ applyRangeFilter(); return; }
  if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  subscribedTab = viewingTab;
  document.getElementById('table-wrap').innerHTML = '<div class="empty">'+t('loading')+'</div>';
  document.getElementById('export-row').style.display = 'none';

  let q = db.collection('records');
  if(viewingTab !== 'ALL') q = q.where('tabName', '==', viewingTab);

  unsubscribe = q.onSnapshot(snap => {
    allRecords = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    applyRangeFilter();
  }, err => {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">'+t('couldNotReach')+'</div>';
    console.error(err);
  });
}

function applyRangeFilter(){
  const from = document.getElementById('range-from').value;
  const to = document.getElementById('range-to').value;
  currentRecords = allRecords.filter(r => (!from || r.date >= from) && (!to || r.date <= to));
  renderAll();
}

function renderAll(){
  renderWayCards();
  renderBalance();
  document.getElementById('export-row').style.display = currentRecords.length ? 'flex' : 'none';
  renderTable();
}

function computeTotals(){
  const suly = { boughtKg:0, boughtTotal:0, soldKg:0, soldTotal:0, grantedKg:0 };
  const buzan = { boughtKg:0, boughtTotal:0, soldKg:0, soldTotal:0, grantedKg:0 };
  let totalMargin = 0, tradeCount = 0;
  const tradeRecords = []; // excludes grants — grants carry no money and shouldn't skew margin/price averages
  currentRecords.forEach(r=>{
    const kg = Number(r.kg)||0;
    if(r.type === GRANT_SULY){ suly.grantedKg += kg; return; }
    if(r.type === GRANT_BUZAN){ buzan.grantedKg += kg; return; }
    const total = Number(r.total)||0, buzanValue = (Number(r.marketPrice)||0)*kg;
    if(r.type === WAY1){ suly.soldKg += kg; suly.soldTotal += total; buzan.boughtKg += kg; buzan.boughtTotal += buzanValue; }
    else if(r.type === WAY2){ suly.boughtKg += kg; suly.boughtTotal += total; buzan.soldKg += kg; buzan.soldTotal += buzanValue; }
    totalMargin += Number(r.margin)||0;
    tradeCount += 1;
    tradeRecords.push(r);
  });
  const totalBuy = suly.boughtTotal + buzan.boughtTotal, totalSell = suly.soldTotal + buzan.soldTotal;
  const totalKg = tradeRecords.reduce((s,r)=>s+(Number(r.kg)||0),0);
  const kgPriceSum = tradeRecords.reduce((s,r)=>s+((Number(r.kg)||0)*(Number(r.negotiatedPrice)||0)),0);
  const income = totalSell - totalBuy;
  const sulyBalanceKg = suly.boughtKg + suly.grantedKg - suly.soldKg;
  const buzanBalanceKg = buzan.boughtKg + buzan.grantedKg - buzan.soldKg;
  return {
    suly, buzan, totalBuy, totalSell, income,
    sulyBalanceKg, buzanBalanceKg,
    incomePerKg: totalKg ? income/totalKg : 0, avgMargin: tradeCount ? totalMargin/tradeCount : 0,
    weightedAvgPrice: totalKg ? kgPriceSum/totalKg : 0,
    way1Net: suly.soldTotal - buzan.boughtTotal,   // Sell Suly / Buy Buzan
    way2Net: buzan.soldTotal - suly.boughtTotal,   // Buy Suly / Sell Buzan
    recordCount: currentRecords.length,
    netProfit: (function(){
      const combined = (suly.soldTotal - buzan.boughtTotal) + (buzan.soldTotal - suly.boughtTotal);
      return sulyBalanceKg !== 0 ? combined / sulyBalanceKg : combined;
    })(),
    // Split of the total result into: matched (closed) kg and unmatched (still open) kg.
    // Profit per KG of each way is applied to its own kg, so closed + open = way1Net + way2Net exactly.
    split: (function(){
      const w1pk = suly.soldKg ? (suly.soldTotal - buzan.boughtTotal) / suly.soldKg : 0;     // profit per KG, Sell Suly / Buy Buzan
      const w2pk = suly.boughtKg ? (buzan.soldTotal - suly.boughtTotal) / suly.boughtKg : 0; // profit per KG, Buy Suly / Sell Buzan
      const matchedKg = Math.min(suly.soldKg, suly.boughtKg);
      const closed = matchedKg * (w1pk + w2pk);
      const openKg = Math.abs(suly.boughtKg - suly.soldKg);
      const open = suly.soldKg > suly.boughtKg ? openKg * w1pk : openKg * w2pk;
      return { matchedKg: matchedKg, openKg: openKg, closed: closed, open: open,
               openSide: suly.soldKg > suly.boughtKg ? 'toBuy' : 'toSell' };
    })()
  };
}

function tsMillis(r){
  if(r.timestamp && typeof r.timestamp.toMillis === 'function') return r.timestamp.toMillis();
  return 0; // a record whose server timestamp hasn't synced yet sorts first, not last
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  if(!currentRecords.length){ wrap.innerHTML = '<div class="empty">'+t('noTransactions')+'</div>'; return; }
  const canEdit = session.role === 'admin' && viewingTab !== 'ALL';
  const showEmployee = viewingTab === 'ALL';
  const byDate = {};
  currentRecords.forEach(r=>{ const d = r.date; if(!byDate[d]) byDate[d]=[]; byDate[d].push(r); });
  const dates = Object.keys(byDate).sort().reverse();

  let html = '';
  dates.forEach(date=>{
    // oldest-entered first, most recently added last — so a new entry lands at the bottom of its day
    const recs = byDate[date].slice().sort((a,b)=> tsMillis(a) - tsMillis(b));
    let dayKg=0, dayTotal=0;
    recs.forEach(r=>{ dayKg += Number(r.kg)||0; dayTotal += Number(r.total)||0; });
    html += '<h3 style="margin:20px 0 8px;font-size:15px;">'+date+
      '<span style="color:var(--muted);font-weight:400;font-size:13px;"> · '+dayKg.toFixed(2)+' kg · '+fmtMoney(dayTotal)+'</span></h3>';
    html += '<table><thead><tr>'+(showEmployee?'<th>'+t('colEmployee')+'</th>':'')+'<th>'+t('colType')+'</th><th>'+t('colKg')+'</th><th>'+t('colCustomer')+'</th><th>'+t('colRate')+'</th><th>'+t('colPrice')+'</th><th>'+t('colOunce')+'</th><th>'+t('colMarket')+'</th><th>'+t('colMargin')+'</th><th>'+t('colPlKg')+'</th><th>'+t('colTotal')+'</th><th>'+t('colEnteredBy')+'</th>'+(canEdit?'<th></th>':'')+'</tr></thead><tbody>';
    recs.forEach(r=>{
      const isGrant = r.type === GRANT_SULY || r.type === GRANT_BUZAN;
      let wayLabel;
      if(r.type === WAY1) wayLabel = t('way1');
      else if(r.type === WAY2) wayLabel = t('way2');
      else if(r.type === GRANT_SULY) wayLabel = '+' + t('grantSuly');
      else wayLabel = '+' + t('grantBuzan');
      html += '<tr'+(isGrant?' style="background:rgba(184,134,11,.06);"':'')+'>'+
        (showEmployee ? '<td>'+esc(r.tabName)+'</td>' : '')+
        '<td>'+wayLabel+'</td>'+
        '<td class="num">'+Number(r.kg).toFixed(2)+'</td>';
      if(isGrant){
        html += '<td>'+esc(r.notes)+'</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>$0</td>'+
          '<td>'+esc(r.enteredBy)+'</td>';
      } else {
        const marginClass = Number(r.margin) >= 0 ? 'margin-pos' : 'margin-neg';
        html += '<td>'+esc(r.customer)+'</td>'+
          '<td class="num">'+Number(r.rate).toFixed(3)+'</td>'+
          '<td class="num">'+fmtMoney(r.negotiatedPrice)+'</td>'+
          '<td class="num">'+Number(r.ounce).toFixed(2)+'</td>'+
          '<td class="num">'+fmtMoney(r.marketPrice)+'</td>'+
          '<td class="num"><span class="margin-pill '+marginClass+'">'+fmtSigned(r.margin)+'</span></td>'+
          '<td class="num"><span class="margin-pill '+(Number(r.margin)>=0?'margin-pos':'margin-neg')+'">'+fmtSigned(Number(r.margin)*Number(r.kg))+'</span></td>'+
          '<td class="num">'+fmtMoney(r.total)+'</td>'+
          '<td>'+esc(r.enteredBy)+'</td>';
      }
      if(canEdit){
        html += '<td class="row-actions">'+
          '<button class="secondary" data-edit-id="'+r.id+'">'+t('edit')+'</button>'+
          '<button class="danger" data-delete-id="'+r.id+'">'+t('delete')+'</button>'+
        '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
  });
  wrap.innerHTML = html;
}

function updateComputed(){
  const kg = parseFloat(document.getElementById('f-kg').value) || 0;
  const rate = parseFloat(document.getElementById('f-rate').value) || 0;
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const ounce = kg / OUNCE_DIVISOR;
  const market = (rate / TROY_OUNCE_GRAMS) * 1000;
  const margin = price - market;
  const total = price * kg;
  document.getElementById('c-ounce').textContent = ounce.toFixed(2);
  document.getElementById('c-market').textContent = fmtMoney(market);
  document.getElementById('c-total').textContent = fmtMoney(total);
  document.getElementById('c-plkg').textContent = fmtSigned(margin * kg);
  const pill = document.querySelector('#c-margin .margin-pill');
  pill.textContent = fmtSigned(margin);
  pill.className = 'margin-pill ' + (margin >= 0 ? 'margin-pos' : 'margin-neg');
  return { ounce, market, margin, total };
}

async function submitRecord(){
  const id = document.getElementById('edit-id').value;
  const kg = parseFloat(document.getElementById('f-kg').value);
  const rate = parseFloat(document.getElementById('f-rate').value);
  const negotiatedPrice = parseFloat(document.getElementById('f-price').value);
  const date = document.getElementById('f-date').value;
  if(!date || !kg || !rate || !negotiatedPrice){ alert(t('fillRequired')); return; }
  const c = updateComputed();
  const data = {
    tabName: viewingTab, date, type: document.getElementById('f-type').value, kg,
    customer: document.getElementById('f-customer').value, rate, negotiatedPrice,
    ounce: c.ounce, marketPrice: c.market, margin: c.margin, total: c.total,
    notes: document.getElementById('f-notes').value, enteredBy: session.fullName,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    if(id) await db.collection('records').doc(id).set(data, { merge: true });
    else await db.collection('records').add(data);
    resetForm();
  }catch(e){ alert(t('couldNotSave') + ' (' + e.message + ')'); }
}

function editRecord(id){
  const r = currentRecords.find(x => x.id === id);
  if(!r) return;
  if(r.type === GRANT_SULY || r.type === GRANT_BUZAN){ editKgGrant(r); return; }
  document.getElementById('edit-id').value = r.id;
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-type').value = r.type;
  document.getElementById('f-kg').value = r.kg;
  document.getElementById('f-customer').value = r.customer;
  document.getElementById('f-rate').value = r.rate;
  document.getElementById('f-price').value = r.negotiatedPrice;
  document.getElementById('f-notes').value = r.notes;
  document.getElementById('form-title').textContent = t('editTransaction');
  document.getElementById('cancel-edit').style.display = 'inline-block';
  updateComputed();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function removeRecord(id){
  if(!confirm(t('confirmDelete'))) return;
  try{ await db.collection('records').doc(id).delete(); }
  catch(e){ alert(t('couldNotDelete') + ' (' + e.message + ')'); }
}

function resetForm(){
  document.getElementById('edit-id').value = '';
  document.getElementById('f-kg').value = '';
  document.getElementById('f-customer').value = '';
  document.getElementById('f-rate').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-notes').value = '';

const EXPORT_COLS = [ // [data key, i18n key for the column title]
  ['Employee','colEmployee'], ['Date','date'], ['Type','colType'], ['KG','colKg'], ['Customer','colCustomer'],
  ['Rate','colRate'], ['Price/KG','colPrice'], ['Ounce','colOunce'], ['Market $/KG','colMarket'],
  ['Margin','colMargin'], ['P/L x KG','colPlKg'], ['Total','colTotal'], ['Entered by','colEnteredBy'], ['Notes','notes']
];
const SIGNED_COLS = ['Margin','P/L x KG'];
function exportLabel(key){ const d = EXPORT_COLS.find(c => c[0] === key); return d ? t(d[1]) : key; }
function esc(x){ return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num2(v){ return Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function exportRows(){
  const showEmp = viewingTab === 'ALL';
  return currentRecords.slice().sort((a,b)=> a.date < b.date ? 1 : -1).map(r => {
    const isGrant = r.type === GRANT_SULY || r.type === GRANT_BUZAN;
    const typeLabel = r.type === WAY1 ? t('way1') : r.type === WAY2 ? t('way2') : r.type === GRANT_SULY ? '+'+t('grantSuly') : '+'+t('grantBuzan');
    const row = {};
    if(showEmp) row['Employee'] = r.tabName || '';
    row['Date'] = r.date; row['Type'] = typeLabel; row['KG'] = round2(r.kg);
    row['Customer'] = isGrant ? '' : (r.customer || '');
    row['Rate'] = isGrant ? '' : +Number(r.rate).toFixed(3);            // kept exactly as typed
    row['Price/KG'] = isGrant ? '' : round2(r.negotiatedPrice);
    row['Ounce'] = isGrant ? '' : round2(r.ounce);
    row['Market $/KG'] = isGrant ? '' : round2(r.marketPrice);
    row['Margin'] = isGrant ? '' : round2(r.margin);
    row['P/L x KG'] = isGrant ? '' : round2(Number(r.margin) * Number(r.kg));
    row['Total'] = isGrant ? '' : round2(r.total);
    row['Entered by'] = r.enteredBy || '';
    row['Notes'] = r.notes || '';
    return row;
  });
}
function exportName(){ return (viewingTab === 'ALL' ? 'All_employees' : viewingTab) + '_' + ymd(new Date()); }
function exportTitle(){ return (viewingTab === 'ALL' ? t('allEmployees') : viewingTab) + ' — ' + t('transactions'); }

function exportXlsx(){
  const rows = exportRows();
  if(!rows.length) return;
  const ws = XLSX.utils.json_to_sheet(rows);
  const cols = Object.keys(rows[0]);
  XLSX.utils.sheet_add_aoa(ws, [cols.map(exportLabel)], { origin: 'A1' });   // column titles in the current language
  rows.forEach((row, i) => cols.forEach((c, j) => {
    const cell = ws[XLSX.utils.encode_cell({ r: i + 1, c: j })];
    if(!cell || cell.t !== 'n') return;
    if(SIGNED_COLS.indexOf(c) !== -1) cell.z = '[Color10]+0.00;[Red]-0.00;0.00'; // green +, red -
    else if(c === 'Rate') cell.z = '0.000';
    else cell.z = '0.00';
  }));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: LANG === 'ckb' }] };                          // right-to-left sheet for Kurdish
  const sheetName = (viewingTab === 'ALL' ? t('allEmployees') : viewingTab).replace(/[\\\/\?\*\[\]:]/g,' ').substring(0,31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, exportName() + '.xlsx');
}

/* ---- PDF ----
   jsPDF can't join Arabic-script letters or lay out right-to-left text, so Kurdish (and any Kurdish customer
   names/notes, even in English mode) came out as symbols. Instead the browser draws each page as HTML — it
   already shapes Arabic correctly — and the pages are placed into the PDF as images. */
const PDF_W = 1123, PDF_H = 794;   // A4 landscape at 96 dpi
const PDF_CSS =
  '.pdf-page{position:fixed;left:-12000px;top:0;width:'+PDF_W+'px;height:'+PDF_H+'px;box-sizing:border-box;padding:26px 30px;background:#fff;color:#111;overflow:hidden;letter-spacing:normal;word-spacing:normal;font-family:"Noto Sans Arabic","Inter",-apple-system,"Segoe UI",Arial,sans-serif;font-size:11px;line-height:1.35;}'+
  '.pdf-page.measure{height:auto;overflow:visible;}'+
  '.pdf-page .pdf-title{margin-bottom:10px;}'+
  '.pdf-page .t1{font-size:18px;font-weight:700;}'+
  '.pdf-page .t2{font-size:11px;color:#666;margin-top:2px;}'+
  '.pdf-page table{width:100%;border-collapse:collapse;table-layout:fixed;}'+
  '.pdf-page th{background:#07101c;color:#fff;font-weight:600;padding:6px 3px;text-align:center;font-size:10px;overflow-wrap:anywhere;white-space:normal;}'+
  '.pdf-page td{padding:5px 3px;text-align:center;border-bottom:1px solid #e3e3e3;vertical-align:middle;font-size:10px;overflow-wrap:anywhere;white-space:normal;}'+
  '.pdf-page tbody tr:nth-child(even) td{background:#f6f6f4;}'+
  '.pdf-page td.n{white-space:nowrap;}'+
  '.pdf-page td.pos{color:#1c7c33;font-weight:700;}'+
  '.pdf-page td.neg{color:#c62828;font-weight:700;}'+
  '.pdf-page .pdf-foot{position:absolute;bottom:12px;left:30px;right:30px;font-size:10px;color:#888;text-align:center;}';

const PDF_COL_W = { 'Employee':7.5, 'Date':7, 'Type':15, 'KG':4.5, 'Customer':9, 'Rate':5, 'Price/KG':6, 'Ounce':4,
  'Market $/KG':6.5, 'Margin':6, 'P/L x KG':7, 'Total':7.5, 'Entered by':11.5, 'Notes':9 };
function ltrSpan(x){ return '<span dir="ltr">'+esc(x)+'</span>'; }
function cleanRate(v){ return String(+Number(v).toFixed(3)); }   // 60.739999999999995 -> 60.74

function pdfCell(col, v){
  if(v === '' || v == null) return '<td></td>';
  if(typeof v === 'number'){
    if(SIGNED_COLS.indexOf(col) !== -1){ const pos = v >= 0; return '<td class="n '+(pos?'pos':'neg')+'" dir="ltr">'+(pos?'+':'-')+num2(Math.abs(v))+'</td>'; }
    if(col === 'Rate') return '<td class="n" dir="ltr">'+cleanRate(v)+'</td>';
    return '<td class="n" dir="ltr">'+num2(v)+'</td>';
  }
  return '<td dir="auto">'+esc(v)+'</td>';
}
function pdfPage(cols, rowsHtml, pageNo, pageCount, extraClass){
  const rtl = LANG === 'ckb';
  const from = document.getElementById('range-from').value, to = document.getElementById('range-to').value;
  const range = (!from && !to) ? t('allTime') : ((from || '…') + '  →  ' + (to || '…'));
  const totalW = cols.reduce((a, c) => a + (PDF_COL_W[c] || 8), 0);
  const colgroup = '<colgroup>' + cols.map(c => '<col style="width:' + ((PDF_COL_W[c] || 8) * 100 / totalW).toFixed(2) + '%">').join('') + '</colgroup>';
  const titleName = viewingTab === 'ALL' ? esc(t('allEmployees')) : '<bdi>' + esc(viewingTab) + '</bdi>';
  const el = document.createElement('div');
  el.className = 'pdf-page' + (extraClass ? ' ' + extraClass : '');
  el.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  el.innerHTML =
    '<style>'+PDF_CSS+'</style>'+
    '<div class="pdf-title"><div class="t1">'+titleName+' — '+esc(t('transactions'))+'</div><div class="t2">'+ltrSpan(range)+'  ·  '+ltrSpan(ymd(new Date()))+'</div></div>'+
    '<table>'+colgroup+'<thead><tr>'+cols.map(c => '<th>'+esc(exportLabel(c))+'</th>').join('')+'</tr></thead><tbody>'+rowsHtml+'</tbody></table>'+
    (pageCount ? '<div class="pdf-foot" dir="ltr">'+pageNo+' / '+pageCount+'</div>' : '');
  return el;
}

async function exportPdf(){
  const rows = exportRows();
  if(!rows.length) return;
  const btns = Array.from(document.querySelectorAll('#export-row button'));
  const labels = btns.map(b => b.textContent);
  btns.forEach(b => { b.disabled = true; b.textContent = '…'; });
  const stage = [];
  try{
    const cols = Object.keys(rows[0]);
    const rowHtml = rows.map(r => '<tr>' + cols.map(c => pdfCell(c, r[c])).join('') + '</tr>');

    // make sure the Arabic-script font is actually loaded before anything is measured or drawn
    try{ await document.fonts.load('400 12px "Noto Sans Arabic"', 'ڕێنووس کوردی سۆرانی ابج'); await document.fonts.load('700 12px "Noto Sans Arabic"', 'ڕێنووس ابج'); }catch(_){}
    await document.fonts.ready;

    // 1) measure every row once so pages are filled without cutting a row in half
    const probe = pdfPage(cols, rowHtml.join(''), 0, 0, 'measure');
    document.body.appendChild(probe); stage.push(probe);
    const rowEls = Array.from(probe.querySelectorAll('tbody tr'));
    const rowH = rowEls.map(tr => tr.getBoundingClientRect().height);
    const headH = probe.querySelector('thead').getBoundingClientRect().height;
    const titleH = probe.querySelector('.pdf-title').getBoundingClientRect().height + 10;
    const capacity = PDF_H - 26*2 - titleH - headH - 22;       // room left for body rows on one page
    probe.remove(); stage.pop();

    const pages = []; let cur = [], used = 0;
    rowH.forEach((h, i) => {
      if(cur.length && used + h > capacity){ pages.push(cur); cur = []; used = 0; }
      cur.push(rowHtml[i]); used += h;
    });
    if(cur.length) pages.push(cur);

    // 2) draw each page with the browser and drop it into the PDF
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    for(let i = 0; i < pages.length; i++){
      const pageEl = pdfPage(cols, pages[i].join(''), i + 1, pages.length);
      document.body.appendChild(pageEl); stage.push(pageEl);
      const canvas = await html2canvas(pageEl, { scale: 2, backgroundColor: '#ffffff', logging: false, width: PDF_W, height: PDF_H, windowWidth: PDF_W });
      if(i > 0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
      pageEl.remove(); stage.pop();
    }
    doc.save(exportName() + '.pdf');
  }catch(e){
    console.error(e);
    alert(t('exportFailed') + ' (' + (e.message || e) + ')');
  }finally{
    stage.forEach(el => el.remove());
    btns.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
  }
}

/* ====== INIT ====== */
document.getElementById('table-wrap').addEventListener('click', (e)=>{
  const editId = e.target.getAttribute('data-edit-id');
  const delId = e.target.getAttribute('data-delete-id');
  if(editId) editRecord(editId);
  if(delId) removeRecord(delId);
});
applyStaticTranslations();
checkFirstRunSetup();
auth.onAuthStateChanged(user => {
  if(user && !session){
    db.collection('employees').doc(user.uid).get().then(doc=>{
      if(doc.exists){
        const d = doc.data();
        session = { uid: user.uid, fullName: d.fullName, role: d.role, tabName: d.tabName };
        enterApp();
      }
    });
  }
});
</script>
