<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suly / Buzan Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130E;
    --surface:#1E1B14;
    --surface-2:#26221A;
    --line:#3A3529;
    --gold:#C89B4A;
    --gold-soft:#8A6D3A;
    --silver:#9AA3AE;
    --cream:#ECE6D8;
    --muted:#9A8F78;
    --green-bg:#1E3324; --green-fg:#7FD99A;
    --red-bg:#3A1F1F; --red-fg:#E38A8A;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Inter',sans-serif;}
  body[dir='rtl']{font-family:'Noto Sans Arabic','Inter',sans-serif;}
  body[dir='rtl'] h1,body[dir='rtl'] h2,body[dir='rtl'] h3{font-family:'Noto Sans Arabic',serif;}
  body[dir='rtl'] .sidebar{border-right:none;border-left:1px solid var(--line);}
  body[dir='rtl'] .row-actions button{margin-right:0;margin-left:6px;}
  .lang-switch{display:flex;gap:6px;margin-bottom:20px;}
  .lang-switch button{flex:1;padding:6px 8px;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}
  .lang-switch button.active{background:var(--gold);color:#1A160E;border-color:var(--gold);}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .num{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  /* ---- Login ---- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:360px;}
  .login-card h1{font-size:28px;color:var(--gold);margin-bottom:4px;}
  .login-card p{color:var(--muted);margin:0 0 28px;font-size:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;}
  input,select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:var(--radius);font-size:14px;font-family:inherit;margin-bottom:16px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft);}
  button{
    background:var(--gold);color:#1A160E;border:none;padding:11px 18px;border-radius:var(--radius);
    font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  button:hover{background:#D8AC5C;}
  button.secondary{background:transparent;color:var(--cream);border:1px solid var(--line);}
  button.secondary:hover{background:var(--surface-2);}
  button.danger{background:transparent;color:var(--red-fg);border:1px solid var(--red-fg);padding:6px 10px;font-size:12px;}
  .error{color:var(--red-fg);font-size:13px;margin:-8px 0 16px;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;flex-shrink:0;}
  .sidebar .brand{font-size:18px;color:var(--gold);margin-bottom:28px;}
  .sidebar .who{font-size:12px;color:var(--muted);margin-bottom:24px;}
  .tab-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--cream);
    padding:9px 10px;border-radius:var(--radius);font-size:14px;margin-bottom:2px;cursor:pointer;}
  .tab-btn:hover{background:var(--surface-2);}
  .tab-btn.active{background:var(--gold);color:#1A160E;font-weight:600;}
  .sidebar .signout{margin-top:24px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  .main{flex:1;padding:32px 40px;max-width:1100px;}
  .main h2{font-size:22px;margin-bottom:4px;}
  .subhead{color:var(--muted);font-size:13px;margin-bottom:24px;}

  .range-row{display:flex;gap:8px;align-items:end;margin-bottom:20px;flex-wrap:wrap;}
  .range-row button.chip{background:var(--surface-2);color:var(--cream);border:1px solid var(--line);
    padding:7px 12px;font-size:13px;font-weight:500;}
  .range-row button.chip.active{background:var(--gold);color:#1A160E;border-color:var(--gold);}
  .range-row input[type=date]{margin-bottom:0;width:auto;}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:32px;}
  .summary-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .summary-card .type{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .summary-card .kg{font-size:20px;font-weight:600;}
  .summary-card .amt{font-size:13px;color:var(--silver);margin-top:2px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:24px;}
  .panel h3{font-size:15px;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px;}
  .form-grid .full{grid-column:1/-1;}
  .computed-row{display:flex;gap:24px;padding:12px 0;margin:4px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .computed-row div{font-size:13px;color:var(--muted);}
  .computed-row span{display:block;color:var(--cream);font-size:15px;margin-top:2px;}
  .margin-pill{display:inline-block;padding:2px 8px;border-radius:var(--radius);font-size:14px;}
  .margin-pos{background:var(--green-bg);color:var(--green-fg);}
  .margin-neg{background:var(--red-bg);color:var(--red-fg);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tr:hover td{background:var(--surface-2);}
  .row-actions button{margin-right:6px;}
  .empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <h1 data-i18n="brand">Suly / Buzan Ledger</h1>
    <p data-i18n="loginSub">Sign in to record and review transactions.</p>
    <div id="login-error" class="error" style="display:none;"></div>
    <label for="lu" data-i18n="username">Username</label>
    <input id="lu" type="text" autocomplete="username">
    <label for="lp" data-i18n="password">Password</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button onclick="doLogin()" style="width:100%;" data-i18n="signIn">Sign in</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="sidebar">
    <div class="brand" data-i18n="brand">Suly / Buzan</div>
    <div class="who" id="who"></div>
    <div id="tab-list"></div>
    <div class="lang-switch"><button id="lang-en" onclick="setLang('en')">English</button><button id="lang-ckb" onclick="setLang('ckb')">کوردی</button></div>
    <div class="signout" onclick="signOut()" data-i18n="signOut">Sign out</div>
  </div>

  <div class="main">
    <h2 id="viewing-title">Log</h2>
    <div class="subhead" id="viewing-sub"></div>

    <div class="range-row">
      <button class="chip" data-range="today" onclick="setRange('today')" data-i18n="today">Today</button>
      <button class="chip" data-range="week" onclick="setRange('week')" data-i18n="thisWeek">This week</button>
      <button class="chip" data-range="month" onclick="setRange('month')" data-i18n="thisMonth">This month</button>
      <button class="chip" data-range="all" onclick="setRange('all')" data-i18n="allTime">All time</button>
      <div><label style="margin-bottom:4px;" data-i18n="from">From</label><input type="date" id="range-from" onchange="setRange('custom')"></div>
      <div><label style="margin-bottom:4px;" data-i18n="to">To</label><input type="date" id="range-to" onchange="setRange('custom')"></div>
    </div>

    <div class="summary-grid" id="summary-grid"></div>
    <div class="panel" id="balance-panel"></div>

    <div class="panel" id="entry-panel" style="display:none;">
      <h3 id="form-title" data-i18n="addTransaction">Add transaction</h3>
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div><label data-i18n="date">Date</label><input type="date" id="f-date"></div>
        <div><label data-i18n="type">Type</label>
          <select id="f-type">
            <option value="Sell Suly / Buy Buzan" data-i18n="way1">Sell Suly / Buy Buzan</option>
            <option value="Buy Suly / Sell Buzan" data-i18n="way2">Buy Suly / Sell Buzan</option>
          </select>
        </div>
        <div><label data-i18n="kg">KG</label><input type="number" step="any" id="f-kg" oninput="updateComputed()"></div>
        <div><label data-i18n="customer">Customer / phone</label><input type="text" id="f-customer"></div>
        <div><label data-i18n="rate">Rate (per troy oz)</label><input type="number" step="any" id="f-rate" oninput="updateComputed()"></div>
        <div><label data-i18n="price">Negotiated price (per KG)</label><input type="number" step="any" id="f-price" oninput="updateComputed()"></div>
        <div class="full"><label data-i18n="notes">Notes</label><input type="text" id="f-notes"></div>
      </div>
      <div class="computed-row">
        <div data-i18n="ounce">Ounce<span class="num" id="c-ounce">0.00</span></div>
        <div data-i18n="marketPrice">Market price / KG<span class="num" id="c-market">$0.00</span></div>
        <div data-i18n="margin">Margin<span class="num" id="c-margin"><span class="margin-pill">$0.00</span></span></div>
        <div data-i18n="total">Total<span class="num" id="c-total">$0.00</span></div>
      </div>
      <button onclick="submitRecord()" data-i18n="saveTransaction">Save transaction</button>
      <button class="secondary" id="cancel-edit" style="display:none;margin-left:8px;" onclick="resetForm()" data-i18n="cancelEdit">Cancel edit</button>
    </div>

    <div class="panel">
      <h3 data-i18n="transactions">Transactions</h3>
      <div id="table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<script>
/* ====== I18N ====== */
const I18N = {
  en: {
    brand: 'Suly / Buzan Ledger', loginSub: 'Sign in to record and review transactions.',
    username: 'Username', password: 'Password', signIn: 'Sign in', signOut: 'Sign out',
    today: 'Today', thisWeek: 'This week', thisMonth: 'This month', allTime: 'All time',
    from: 'From', to: 'To', addTransaction: 'Add transaction', editTransaction: 'Edit transaction',
    date: 'Date', type: 'Type', way1: 'Sell Suly / Buy Buzan', way2: 'Buy Suly / Sell Buzan',
    kg: 'KG', customer: 'Customer / phone', rate: 'Rate (per troy oz)', price: 'Negotiated price (per KG)',
    notes: 'Notes', ounce: 'Ounce', marketPrice: 'Market price / KG', margin: 'Margin', total: 'Total',
    saveTransaction: 'Save transaction', cancelEdit: 'Cancel edit', transactions: 'Transactions',
    allEmployees: 'All employees', viewOnlySub: 'View-only — ask the admin to add or change transactions.',
    editableSub: 'Add, edit, or review transactions for this tab.', combinedTitle: 'All employees — combined view',
    combinedSub: 'Read-only combined summary across every tab.', selectEmployee: 'Select an individual employee tab to see line-by-line transactions.',
    noTransactions: 'No transactions in this range.', loading: 'Loading…',
    sulyBought: 'Suly bought', sulySold: 'Suly sold', buzanBought: 'Buzan bought', buzanSold: 'Buzan sold',
    balanceTitle: 'Balance & income for this range', sulyLeft: 'Suly left to sell', buzanLeft: 'Buzan left to sell',
    totalBought: 'Total bought', totalSold: 'Total sold', income: 'Income', incomePerKg: 'Income per KG',
    avgMargin: 'Average margin', txnCount: 'Transactions', edit: 'Edit', delete: 'Delete',
    fillRequired: 'Fill in date, KG, rate, and price.', confirmDelete: 'Delete this transaction? This cannot be undone.',
    couldNotSave: 'Could not save.', couldNotDelete: 'Could not delete.', enterCreds: 'Enter username and password.',
    invalidLogin: 'Invalid login.', couldNotReach: 'Could not reach the server. Check the connection.',
    colType: 'Type', colKg: 'KG', colCustomer: 'Customer', colRate: 'Rate', colPrice: 'Price/KG',
    colOunce: 'Ounce', colMarket: 'Market $', colMargin: 'Margin', colTotal: 'Total'
  },
  ckb: {
    brand: 'تۆمارنامەی سولی / بوزان', loginSub: 'بچۆ ژوورەوە بۆ تۆمارکردن و پێداچوونەوەی مامەڵەکان.',
    username: 'ناوی بەکارهێنەر', password: 'وشەی نهێنی', signIn: 'چوونەژوورەوە', signOut: 'چوونەدەرەوە',
    today: 'ئەمڕۆ', thisWeek: 'ئەم هەفتەیە', thisMonth: 'ئەم مانگە', allTime: 'هەموو کات',
    from: 'لە', to: 'بۆ', addTransaction: 'زیادکردنی مامەڵە', editTransaction: 'دەستکاریکردنی مامەڵە',
    date: 'بەروار', type: 'جۆر', way1: 'فرۆشتنی سولی / کڕینی بوزان', way2: 'کڕینی سولی / فرۆشتنی بوزان',
    kg: 'کیلۆگرام', customer: 'کڕیار / ژمارەی مۆبایل', rate: 'نرخ (بۆ ئۆنسی تروی)', price: 'نرخی ڕێککەوتوو (بۆ هەر کیلۆیەک)',
    notes: 'تێبینی', ounce: 'ئۆنس', marketPrice: 'نرخی بازاڕ / کیلۆ', margin: 'جیاوازی نرخ', total: 'کۆی گشتی',
    saveTransaction: 'پاشەکەوتکردنی مامەڵە', cancelEdit: 'هەڵوەشاندنەوەی دەستکاری', transactions: 'مامەڵەکان',
    allEmployees: 'هەموو کارمەندەکان', viewOnlySub: 'تەنها بۆ بینین — داوا لە بەڕێوەبەر بکە بۆ زیادکردن یان گۆڕینی مامەڵەکان.',
    editableSub: 'زیادکردن، دەستکاریکردن، یان پێداچوونەوەی مامەڵەکان بۆ ئەم لاپەڕەیە.', combinedTitle: 'هەموو کارمەندەکان — بینینی گشتی',
    combinedSub: 'کورتەیەکی گشتیی تەنها بۆ بینین، بۆ هەموو لاپەڕەکان.', selectEmployee: 'یەک کارمەند هەڵبژێرە بۆ بینینی مامەڵەکان بە ڕیز.',
    noTransactions: 'هیچ مامەڵەیەک لەم ماوەیەدا نییە.', loading: 'بارکردن...',
    sulyBought: 'سولی کڕدراو', sulySold: 'سولی فرۆشراو', buzanBought: 'بوزان کڕدراو', buzanSold: 'بوزان فرۆشراو',
    balanceTitle: 'باڵانس و داهات بۆ ئەم ماوەیە', sulyLeft: 'سولی ماوە بۆ فرۆشتن', buzanLeft: 'بوزان ماوە بۆ فرۆشتن',
    totalBought: 'کۆی کڕین', totalSold: 'کۆی فرۆشتن', income: 'داهات', incomePerKg: 'داهات بۆ هەر کیلۆیەک',
    avgMargin: 'تێکڕای قازانج', txnCount: 'ژمارەی مامەڵەکان', edit: 'دەستکاری', delete: 'سڕینەوە',
    fillRequired: 'بەروار، کیلۆگرام، نرخ، و بەها پڕبکەرەوە.', confirmDelete: 'ئەم مامەڵەیە بسڕدرێتەوە؟ ناتوانرێت هەڵبوەشێندرێتەوە.',
    couldNotSave: 'نەتوانرا پاشەکەوت بکرێت.', couldNotDelete: 'نەتوانرا بسڕدرێتەوە.', enterCreds: 'ناوی بەکارهێنەر و وشەی نهێنی بنووسە.',
    invalidLogin: 'چوونەژوورەوە هەڵەیە.', couldNotReach: 'نەتوانرا پەیوەندی بە سێرڤەرەوە بکرێت. پەیوەندییەکەت بپشکنە.',
    colType: 'جۆر', colKg: 'کیلۆ', colCustomer: 'کڕیار', colRate: 'نرخ', colPrice: 'نرخ/کیلۆ',
    colOunce: 'ئۆنس', colMarket: 'نرخی بازاڕ', colMargin: 'جیاوازی', colTotal: 'کۆی گشتی'
  }
};
let LANG = localStorage.getItem('sbl_lang') || 'en';
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }

function setLang(lang){
  LANG = lang;
  localStorage.setItem('sbl_lang', lang);
  document.body.setAttribute('dir', lang === 'ckb' ? 'rtl' : 'ltr');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-ckb').classList.toggle('active', lang === 'ckb');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    // preserve any nested elements (like the computed-row <span>) inside labels
    const nested = el.querySelector('span');
    el.textContent = t(key);
    if(nested) el.appendChild(nested);
  });
  if(session){
    document.getElementById('viewing-sub').textContent = viewingTab === 'ALL' ? t('combinedSub') :
      (session.role === 'admin' ? t('editableSub') : t('viewOnlySub'));
    if(viewingTab === 'ALL') document.getElementById('viewing-title').textContent = t('combinedTitle');
    buildSidebar();
    loadData();
  }
}

/* ====== CONFIG ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzFdrmwEcBDUgLAq_YftrbCDC8Na9dvGwE1S1n47-AFm9u-h5pvIJBEQKmMfS9t3_Il/exec';

/* ====== STATE ====== */
let session = null;      // {username, password, role, tabName, fullName}
let viewingTab = null;   // which tab is currently displayed
let employees = [];
let currentRange = 'today';
let currentRecords = [];

/* ====== API ====== */
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify(Object.assign({ action, username: session ? session.username : payload.username,
      password: session ? session.password : payload.password }, payload))
  });
  return res.json();
}

/* ====== LOGIN ====== */
async function doLogin(){
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!username || !password){ errEl.textContent = t('enterCreds'); errEl.style.display='block'; return; }
  try{
    const r = await api('login', { username, password });
    if(!r.ok){ errEl.textContent = r.error || t('invalidLogin'); errEl.style.display='block'; return; }
    session = { username, password, role: r.role, tabName: r.tabName, fullName: r.fullName };
    localStorage.setItem('sbl_session', JSON.stringify(session));
    enterApp();
  }catch(e){
    errEl.textContent = t('couldNotReach');
    errEl.style.display = 'block';
  }
}

function signOut(){
  session = null;
  localStorage.removeItem('sbl_session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
}

async function enterApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('who').textContent = session.fullName + ' · ' + session.role;
  viewingTab = session.tabName;
  document.getElementById('entry-panel').style.display = (session.role === 'admin') ? 'block' : 'none';
  document.getElementById('viewing-title').textContent = viewingTab;
  document.getElementById('viewing-sub').textContent = session.role === 'admin' ? t('editableSub') : t('viewOnlySub');
  await buildSidebar();
  document.getElementById('f-date').valueAsDate = new Date();
  setRange('today');
}

async function buildSidebar(){
  const list = document.getElementById('tab-list');
  list.innerHTML = '';
  if(session.role === 'admin'){
    const r = await api('listEmployees', {});
    employees = r.ok ? r.employees : [];
    const allBtn = document.createElement('button');
    allBtn.className = 'tab-btn' + (viewingTab==='ALL' ? ' active' : '');
    allBtn.textContent = t('allEmployees');
    allBtn.onclick = () => switchTab('ALL');
    list.appendChild(allBtn);
    employees.forEach(emp => {
      const b = document.createElement('button');
      b.className = 'tab-btn' + (viewingTab===emp.tabName ? ' active' : '');
      b.textContent = emp.fullName + ' (' + emp.tabName + ')';
      b.onclick = () => switchTab(emp.tabName);
      list.appendChild(b);
    });
  } else {
    const b = document.createElement('button');
    b.className = 'tab-btn active';
    b.textContent = session.fullName;
    list.appendChild(b);
  }
}

function switchTab(tabName){
  viewingTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const canEdit = (tabName !== 'ALL') && session.role === 'admin';
  document.getElementById('entry-panel').style.display = canEdit ? 'block' : 'none';
  document.getElementById('viewing-title').textContent = tabName === 'ALL' ? t('combinedTitle') : tabName;
  document.getElementById('viewing-sub').textContent = tabName === 'ALL' ? t('combinedSub') : t('editableSub');
  loadData();
}

/* ====== DATE RANGE ====== */
function setRange(mode){
  currentRange = mode;
  document.querySelectorAll('.range-row .chip').forEach(b=>b.classList.remove('active'));
  const now = new Date();
  let from = null, to = null;
  if(mode === 'today'){
    from = to = ymd(now);
  } else if(mode === 'week'){
    const day = now.getDay();
    const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7));
    from = ymd(monday); to = ymd(now);
  } else if(mode === 'month'){
    from = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
    to = ymd(now);
  } else if(mode === 'all'){
    from = ''; to = '';
  }
  if(mode !== 'custom'){
    document.getElementById('range-from').value = from || '';
    document.getElementById('range-to').value = to || '';
    const btn = document.querySelector('.chip[data-range="'+mode+'"]');
    if(btn) btn.classList.add('active');
  }
  loadData();
}
function ymd(d){ return d.toISOString().slice(0,10); }

/* ====== DATA LOAD ====== */
async function loadData(){
  const from = document.getElementById('range-from').value;
  const to = document.getElementById('range-to').value;
  document.getElementById('table-wrap').innerHTML = '<div class="empty">'+t('loading')+'</div>';

  const summaryPromise = api('summary', { tabName: viewingTab, dateFrom: from, dateTo: to });
  const recordsPromise = (viewingTab === 'ALL') ? Promise.resolve(null) : api('listRecords', { tabName: viewingTab, dateFrom: from, dateTo: to });

  const [sumR, listR] = await Promise.all([summaryPromise, recordsPromise]);
  renderSummary(sumR);

  if(viewingTab === 'ALL'){
    document.getElementById('table-wrap').innerHTML = '<div class="empty">'+t('selectEmployee')+'</div>';
    return;
  }
  currentRecords = listR.ok ? listR.records : [];
  renderTable();
}

function renderSummary(r){
  const grid = document.getElementById('summary-grid');
  const bal = document.getElementById('balance-panel');
  if(!r.ok){ grid.innerHTML = ''; bal.innerHTML = '<div class="empty">'+t('couldNotReach')+'</div>'; return; }

  function card(label, kg, total){
    return '<div class="summary-card"><div class="type">'+label+'</div>'+
      '<div class="kg num">'+kg.toFixed(2)+' kg</div>'+
      '<div class="amt num">$'+Math.round(total).toLocaleString()+'</div></div>';
  }
  grid.innerHTML =
    card(t('sulyBought'), r.suly.boughtKg, r.suly.boughtTotal) +
    card(t('sulySold'), r.suly.soldKg, r.suly.soldTotal) +
    card(t('buzanBought'), r.buzan.boughtKg, r.buzan.boughtTotal) +
    card(t('buzanSold'), r.buzan.soldKg, r.buzan.soldTotal);

  const incomeClass = r.income >= 0 ? 'margin-pos' : 'margin-neg';
  bal.innerHTML =
    '<h3>'+t('balanceTitle')+'</h3>'+
    '<div class="computed-row">'+
      '<div>'+t('sulyLeft')+'<span class="num">'+r.sulyBalanceKg.toFixed(2)+' kg</span></div>'+
      '<div>'+t('buzanLeft')+'<span class="num">'+r.buzanBalanceKg.toFixed(2)+' kg</span></div>'+
      '<div>'+t('totalBought')+'<span class="num">$'+Math.round(r.totalBuy).toLocaleString()+'</span></div>'+
      '<div>'+t('totalSold')+'<span class="num">$'+Math.round(r.totalSell).toLocaleString()+'</span></div>'+
      '<div>'+t('income')+'<span class="num"><span class="margin-pill '+incomeClass+'">$'+Math.round(r.income).toLocaleString()+'</span></span></div>'+
      '<div>'+t('incomePerKg')+'<span class="num">$'+r.incomePerKg.toFixed(2)+'</span></div>'+
      '<div>'+t('avgMargin')+'<span class="num">$'+r.avgMargin.toFixed(2)+'</span></div>'+
      '<div>'+t('txnCount')+'<span class="num">'+r.recordCount+'</span></div>'+
    '</div>';
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  if(!currentRecords.length){ wrap.innerHTML = '<div class="empty">'+t('noTransactions')+'</div>'; return; }

  const canEdit = session.role === 'admin';
  const byDate = {};
  currentRecords.forEach(r=>{
    const d = fmtDate(r.Date);
    if(!byDate[d]) byDate[d] = [];
    byDate[d].push(r);
  });
  const dates = Object.keys(byDate).sort().reverse();

  let html = '';
  dates.forEach(date=>{
    const recs = byDate[date];
    let dayKg = 0, dayTotal = 0;
    recs.forEach(r=>{ dayKg += Number(r.KG)||0; dayTotal += Number(r.Total)||0; });

    html += '<h3 style="margin:20px 0 8px;font-size:15px;">'+date+
      '<span style="color:var(--muted);font-weight:400;font-size:13px;"> · '+dayKg.toFixed(2)+' kg · $'+Math.round(dayTotal).toLocaleString()+'</span></h3>';
    html += '<table><thead><tr><th>'+t('colType')+'</th><th>'+t('colKg')+'</th><th>'+t('colCustomer')+'</th><th>'+t('colRate')+'</th><th>'+t('colPrice')+'</th><th>'+t('colOunce')+'</th><th>'+t('colMarket')+'</th><th>'+t('colMargin')+'</th><th>'+t('colTotal')+'</th>'+(canEdit?'<th></th>':'')+'</tr></thead><tbody>';
    recs.forEach(r=>{
      const marginClass = Number(r.Margin) >= 0 ? 'margin-pos' : 'margin-neg';
      html += '<tr>'+
        '<td>'+wayOf(r.Type)+'</td>'+
        '<td class="num">'+Number(r.KG).toFixed(2)+'</td>'+
        '<td>'+(r.Customer||'')+'</td>'+
        '<td class="num">'+Number(r.Rate).toFixed(3)+'</td>'+
        '<td class="num">$'+Number(r.NegotiatedPrice).toFixed(2)+'</td>'+
        '<td class="num">'+Number(r.Ounce).toFixed(3)+'</td>'+
        '<td class="num">$'+Number(r.MarketPrice).toFixed(2)+'</td>'+
        '<td class="num"><span class="margin-pill '+marginClass+'">$'+Number(r.Margin).toFixed(2)+'</span></td>'+
        '<td class="num">$'+Math.round(r.Total).toLocaleString()+'</td>';
      if(canEdit){
        html += '<td class="row-actions">'+
          '<button class="secondary" onclick="editRecord(\''+r.ID+'\')">'+t('edit')+'</button>'+
          '<button class="danger" onclick="removeRecord(\''+r.ID+'\')">'+t('delete')+'</button>'+
        '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
  });
  wrap.innerHTML = html;
}
function fmtDate(d){ return String(d).slice(0,10); }
function wayOf(t){
  t = String(t);
  if(t === 'Sell Suly' || t === 'Buy Buzan' || t === 'Sell Suly / Buy Buzan') return 'Sell Suly / Buy Buzan';
  return 'Buy Suly / Sell Buzan';
}

/* ====== FORM / COMPUTED FIELDS ====== */
function updateComputed(){
  const kg = parseFloat(document.getElementById('f-kg').value) || 0;
  const rate = parseFloat(document.getElementById('f-rate').value) || 0;
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const ounce = kg / 155.52;
  const market = (rate / 31.103479) * 1000;
  const margin = price - market;
  const total = price * kg;
  document.getElementById('c-ounce').textContent = ounce.toFixed(3);
  document.getElementById('c-market').textContent = '$' + market.toFixed(2);
  document.getElementById('c-total').textContent = '$' + Math.round(total).toLocaleString();
  const pill = document.querySelector('#c-margin .margin-pill');
  pill.textContent = '$' + margin.toFixed(2);
  pill.className = 'margin-pill ' + (margin >= 0 ? 'margin-pos' : 'margin-neg');
}

async function submitRecord(){
  const id = document.getElementById('edit-id').value;
  const payload = {
    tabName: viewingTab,
    date: document.getElementById('f-date').value,
    type: document.getElementById('f-type').value,
    kg: document.getElementById('f-kg').value,
    customer: document.getElementById('f-customer').value,
    rate: document.getElementById('f-rate').value,
    negotiatedPrice: document.getElementById('f-price').value,
    notes: document.getElementById('f-notes').value
  };
  if(!payload.date || !payload.kg || !payload.rate || !payload.negotiatedPrice){
    alert(t('fillRequired')); return;
  }
  const r = id ? await api('updateRecord', Object.assign({id}, payload)) : await api('addRecord', payload);
  if(!r.ok){ alert(r.error || t('couldNotSave')); return; }
  resetForm();
  loadData();
}

function editRecord(id){
  const r = currentRecords.find(x => x.ID === id);
  if(!r) return;
  document.getElementById('edit-id').value = r.ID;
  document.getElementById('f-date').value = fmtDate(r.Date);
  document.getElementById('f-type').value = wayOf(r.Type);
  document.getElementById('f-kg').value = r.KG;
  document.getElementById('f-customer').value = r.Customer;
  document.getElementById('f-rate').value = r.Rate;
  document.getElementById('f-price').value = r.NegotiatedPrice;
  document.getElementById('f-notes').value = r.Notes;
  document.getElementById('form-title').textContent = t('editTransaction');
  document.getElementById('cancel-edit').style.display = 'inline-block';
  updateComputed();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function removeRecord(id){
  if(!confirm(t('confirmDelete'))) return;
  const r = await api('deleteRecord', { tabName: viewingTab, id });
  if(!r.ok){ alert(r.error || t('couldNotDelete')); return; }
  loadData();
}

function resetForm(){
  document.getElementById('edit-id').value = '';
  document.getElementById('f-kg').value = '';
  document.getElementById('f-customer').value = '';
  document.getElementById('f-rate').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-date').valueAsDate = new Date();
  document.getElementById('form-title').textContent = t('addTransaction');
  document.getElementById('cancel-edit').style.display = 'none';
  updateComputed();
}

/* ====== INIT ====== */
(function init(){
  document.body.setAttribute('dir', LANG === 'ckb' ? 'rtl' : 'ltr');
  document.getElementById('lang-en').classList.toggle('active', LANG === 'en');
  document.getElementById('lang-ckb').classList.toggle('active', LANG === 'ckb');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const nested = el.querySelector('span');
    el.textContent = t(key);
    if(nested) el.appendChild(nested);
  });
  const saved = localStorage.getItem('sbl_session');
  if(saved){
    session = JSON.parse(saved);
    enterApp();
  }
})();
</script>
